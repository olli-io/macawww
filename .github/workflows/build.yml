name: build

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - run: swift test

  build:
    needs: test
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      # macos-26 is an Apple silicon runner: the binary is arm64 only
      - run: swift build -c release
      - run: cp .build/release/macpixel macpixel-arm64-macos && lipo -info macpixel-arm64-macos
      - uses: actions/upload-artifact@v7
        with:
          name: macpixel-arm64-macos
          path: macpixel-arm64-macos
          if-no-files-found: error
      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shasum -a 256 macpixel-arm64-macos > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes \
            macpixel-arm64-macos SHA256SUMS
